<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apacom — Personal Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff; --ink:#15171c; --muted:#5d6472; --line:#e3e5ea; --soft:#f5f6f8;
  --accent:#2a3fe0; --accent-ink:#ffffff; --accent-soft:#eef0fd;
  --ok:#0f7d55; --err:#c0322b; --note:#fff8e1; --note-line:#f0d98a;
  --font:'Figtree','IBM Plex Sans Arabic','Noto Sans SC',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --emoji:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121318; --ink:#eceef3; --muted:#a1a7b4; --line:#2b2e37; --soft:#1b1d24;
    --accent:#7d8cff; --accent-ink:#0d0f1a; --accent-soft:#232848;
    --ok:#4fd1a0; --err:#ff8a80; --note:#2a2616; --note-line:#5b4f22;
  }
}
:root[data-theme="dark"]{
  --paper:#121318; --ink:#eceef3; --muted:#a1a7b4; --line:#2b2e37; --soft:#1b1d24;
  --accent:#7d8cff; --accent-ink:#0d0f1a; --accent-soft:#232848;
  --ok:#4fd1a0; --err:#ff8a80; --note:#2a2616; --note-line:#5b4f22;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
html[lang="zh"] body{font-family:'Noto Sans SC','Figtree',system-ui,sans-serif}
html[lang="ar"] body{font-family:'IBM Plex Sans Arabic','Figtree',system-ui,sans-serif;line-height:1.65}
.flag{font-family:var(--emoji);font-size:1.15em;line-height:1;font-style:normal}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;max-width:1080px;margin:0 auto}
.mark{font-weight:800;font-size:1.15rem;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.mark i{width:22px;height:22px;border-radius:50%;border:3px solid var(--accent);display:inline-block;position:relative}
.mark i::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--accent)}
.lang{position:relative}
.lang-btn{display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.lang-btn:hover{background:var(--soft)}
.lang-menu{position:absolute;inset-inline-end:0;top:calc(100% + 6px);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:250px;white-space:nowrap;box-shadow:0 10px 30px rgba(20,24,40,.12);z-index:30;display:none}
.lang-menu.open{display:block}
.lang-menu button{display:flex;width:100%;align-items:center;gap:10px;padding:9px 10px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:start}
.lang-menu button:hover,.lang-menu button[aria-checked="true"]{background:var(--accent-soft)}
.lang-menu small{color:var(--muted);margin-inline-start:auto;padding-inline-start:16px;font-size:.78rem}

/* hero */
main{max-width:560px;margin:0 auto;padding:28px 20px 60px}
h1{font-size:clamp(1.9rem,5.2vw,2.75rem);line-height:1.08;letter-spacing:-.035em;font-weight:800;margin:20px 0 14px}
html[lang="ar"] h1,html[lang="zh"] h1{letter-spacing:0;line-height:1.3}
h1 .hours{display:block;font-size:1.65em;letter-spacing:-.05em;color:var(--accent);font-variant-numeric:tabular-nums}
html[lang="ar"] h1 .hours,html[lang="zh"] h1 .hours{letter-spacing:0}
.lead{color:var(--muted);font-size:1.06rem;margin:0 0 32px;max-width:52ch}

/* stepper */
.steps{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 26px}
.steps li{flex:1;font-size:.82rem;color:var(--muted)}
.steps li::before{content:"";display:block;height:4px;border-radius:4px;background:var(--line);margin-bottom:7px}
.steps li.on{color:var(--ink);font-weight:600}
.steps li.on::before,.steps li.done::before{background:var(--accent)}
.steps b{font-variant-numeric:tabular-nums;margin-inline-end:4px}

/* form */
h2{font-size:1.4rem;letter-spacing:-.02em;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 22px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.row{grid-template-columns:1fr}}
.field{margin-bottom:16px;position:relative}
label.lbl,.lbl{display:block;font-size:.88rem;font-weight:600;margin-bottom:6px}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--paper);transition:border-color .15s}
.inp:hover{border-color:#c6cad3}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp[aria-invalid="true"]{border-color:var(--err)}
textarea.inp{min-height:84px;resize:vertical}
.err{color:var(--err);font-size:.85rem;margin-top:5px;min-height:0}
.err:empty{display:none}
.hint{color:var(--muted);font-size:.84rem;margin-top:5px}
.pw{position:relative}
.pw .inp{padding-right:76px}
[dir="rtl"] .pw .inp{padding-left:76px;padding-right:14px;text-align:right}
.pw-toggle{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--accent);font-weight:600;font-size:.86rem;padding:6px 8px;cursor:pointer}
.meter{display:flex;gap:4px;margin-top:8px;align-items:center}
.meter span{height:4px;flex:1;border-radius:4px;background:var(--line)}
.meter em{font-style:normal;font-size:.8rem;color:var(--muted);min-width:56px;text-align:end}
.meter[data-s="1"] span:nth-child(1){background:var(--err)}
.meter[data-s="2"] span:nth-child(-n+2){background:#d89a1c}
.meter[data-s="3"] span{background:var(--ok)}

/* country combobox */
.cb-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:start;cursor:pointer}
.cb-btn .ph{color:var(--muted)}
.cb-btn .chev{color:var(--muted);font-size:.8rem}
.cb-pop{position:absolute;inset-inline:0;top:calc(100% + 4px);background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(20,24,40,.14);z-index:20;display:none;overflow:hidden}
.cb-pop.open{display:block}
.cb-pop .inp{border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none}
.cb-list{max-height:290px;overflow-y:auto;margin:0;padding:4px;list-style:none}
.cb-list .grp{font-size:.76rem;color:var(--muted);padding:8px 10px 4px}
.cb-list [role="option"]{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 10px;border-radius:8px;cursor:pointer}
.cb-list [role="option"][aria-selected="true"]{font-weight:600}
.cb-list [role="option"].act{background:var(--accent-soft)}
.cb-list .code{color:var(--muted);font-size:.78rem;margin-inline-start:6px}
.cb-empty{padding:14px;color:var(--muted);font-size:.9rem}

/* choice groups */
fieldset{border:0;padding:0;margin:0 0 20px;min-width:0}
legend{font-size:.88rem;font-weight:600;margin-bottom:8px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:.92rem;transition:background .12s,border-color .12s}
.chip input:hover+span{border-color:#b9bec9}
.chip input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

/* buttons */
.actions{display:flex;gap:10px;margin-top:8px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:13px 22px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.55;cursor:default;filter:none}
.btn.full{width:100%}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.link{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:6px 0}
.link[disabled]{color:var(--muted);cursor:default}

.note{background:var(--note);border:1px solid var(--note-line);border-radius:10px;padding:12px 14px;font-size:.92rem;margin:0 0 18px}
.note b{font-variant-numeric:tabular-nums;letter-spacing:.12em;font-size:1.05rem}
.code-inp{font-size:1.5rem;letter-spacing:.5em;text-align:center;font-variant-numeric:tabular-nums}
.ok{color:var(--ok);font-weight:600}

/* done */
.summary{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:0 0 22px}
.summary dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0;font-size:.92rem}
.summary dt{color:var(--muted)}
.summary dd{margin:0}
.agents{list-style:none;padding:0;margin:0 0 22px}
.agents li{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:14px 0;border-top:1px solid var(--line)}
.agents li:last-child{border-bottom:1px solid var(--line)}
.agents .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);margin-top:7px;box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 18%,transparent)}
.agents h3{margin:0;font-size:1rem}
.agents p{margin:0;color:var(--muted);font-size:.92rem;grid-column:2}
.agents ul{grid-column:2;margin:6px 0 0;padding-inline-start:18px;font-size:.9rem}
.agents .rh{grid-column:2;font-size:.8rem;color:var(--muted);margin-top:8px;font-weight:600}
.status{font-size:.86rem;color:var(--muted);margin:0 0 18px}
footer{max-width:560px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:.8rem}
.agree{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:.93rem}
.agree input{width:18px;height:18px;margin:2px 0 0;flex:none;accent-color:var(--accent);cursor:pointer}
.agree input[aria-invalid="true"]{outline:2px solid var(--err);outline-offset:2px}
.agree a,.legal-links a{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.legal-links{display:flex;flex-wrap:wrap;gap:6px 20px;margin-bottom:8px}
.legal-links a{font-size:.88rem}
footer{border-top:1px solid var(--line);padding-top:18px}
.doc{max-width:66ch}
.doc .doc-title{font-size:clamp(1.7rem,4.5vw,2.3rem);letter-spacing:-.03em;line-height:1.15;margin:16px 0 6px}
html[lang="ar"] .doc .doc-title,html[lang="zh"] .doc .doc-title{letter-spacing:0;line-height:1.4}
.doc-meta{color:var(--muted);font-size:.88rem;margin:0 0 18px}
.doc-intro{font-size:1.04rem;margin:0 0 8px}
.doc h2{font-size:1.06rem;margin:26px 0 6px;letter-spacing:0}
.doc p{margin:0 0 6px;max-width:66ch}
#docBack{margin-top:30px}
/* clickable avatar */
.avatar-edit{position:relative;flex:none}
.avatar-pick{position:relative;display:block;border-radius:50%;cursor:pointer}
.avatar-pick:focus-within{outline:2px solid var(--accent);outline-offset:3px}
.avatar-cam{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;background:rgba(15,18,30,.55);color:#fff;opacity:0;transition:opacity .15s}
.avatar-pick:hover .avatar-cam,.avatar-pick:focus-within .avatar-cam{opacity:1}
@media (hover:none){.avatar-cam{opacity:0}}
.avatar-del{position:absolute;inset-inline-end:-4px;top:-4px;width:26px;height:26px;border-radius:50%;border:2px solid var(--paper);background:var(--ink);color:var(--paper);display:grid;place-items:center;cursor:pointer;padding:0}
.avatar-del:hover{background:var(--err)}
/* top bar user */
body.wide footer{max-width:880px}
.top-r{display:flex;align-items:center;gap:10px}
.top-user{display:flex;align-items:center;gap:8px}
.avatar-btn{display:flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;padding:4px 6px;border-radius:999px;font-weight:600}
.avatar-btn:hover{background:var(--soft)}
@media (max-width:560px){#topName{display:none}}
.btn.sm{padding:7px 14px;font-size:.88rem;border-radius:999px}
.avatar{display:inline-grid;place-items:center;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.sm{width:30px;height:30px;font-size:.78rem}
.avatar.lg{width:64px;height:64px;font-size:1.35rem}
.avatar.xl{width:96px;height:96px;font-size:1.9rem}
.switch{margin:18px 0 0;color:var(--muted);font-size:.93rem;text-align:center}
.flash{background:var(--accent-soft);border-radius:10px;padding:12px 14px;margin:0 0 18px;font-weight:600}

/* cabinet */
#cab{max-width:880px;margin:0 auto;padding:24px 20px 60px}
.cab-head{display:flex;align-items:center;gap:18px;margin:8px 0 22px}
.cab-hello{font-size:clamp(1.6rem,4vw,2.2rem);letter-spacing:-.03em;line-height:1.15;margin:0 0 4px}
html[lang="ar"] .cab-hello,html[lang="zh"] .cab-hello{letter-spacing:0}
.cab-meta{margin:0;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 18px;font-size:.93rem}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:26px;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;padding:12px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.pill{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer}
.pill[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.pill small{font-weight:600;font-size:.74rem;border-radius:999px;padding:1px 8px}
.pill .count{background:var(--accent);color:var(--accent-ink)}
.pill .soon{background:var(--soft);color:var(--muted)}
.domain h2{font-size:1.5rem;margin:0 0 6px}
.sec-h{font-size:.95rem;margin:26px 0 8px;color:var(--muted);font-weight:600}
.ask{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;margin-bottom:18px}
.ask .err{grid-column:1/-1;margin:0}
@media (max-width:560px){.ask{grid-template-columns:1fr}}
.answer{border-inline-start:3px solid var(--accent);padding:4px 0 4px 18px;margin:0 0 22px}
[dir="rtl"] .answer{padding:4px 18px 4px 0}
.answer-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 14px;align-items:baseline}
.answer h4{margin:0;font-size:1.06rem}
.answer time{color:var(--muted);font-size:.8rem}
.answer p{margin:6px 0}
.answer .asked{color:var(--muted);font-style:italic;font-size:.92rem}
.answer ol,.answer ul{margin:4px 0 8px;padding-inline-start:20px}
.answer .rh{font-size:.8rem;color:var(--muted);font-weight:600;margin-top:10px}
.muted-link{color:var(--muted);font-weight:500;font-size:.85rem}
.facts{display:grid;grid-template-columns:minmax(140px,max-content) 1fr;gap:10px 24px;margin:0 0 24px}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.facts dd.muted{color:var(--muted)}
@media (max-width:520px){.facts{grid-template-columns:1fr;gap:2px}.facts dd{margin-bottom:10px}}
.sec{border-top:1px solid var(--line);padding:24px 0;max-width:640px}
.sec:first-child{border-top:0;padding-top:0}
.sec h2{font-size:1.1rem;margin:0 0 10px}
.photo-row{display:flex;gap:20px;align-items:center}
.file-btn{cursor:pointer;display:inline-block}
.file-btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.link.danger{color:var(--err)}
.okmsg{color:var(--ok);font-weight:600;font-size:.9rem}
.okmsg:empty{display:none}
.verify-box{margin-top:18px;padding-top:18px;border-top:1px dashed var(--line)}
.danger-zone h2{color:var(--err)}
.danger-btn{background:var(--err);color:#fff}
.flash-wrap{max-width:880px;margin:0 auto;padding:0 20px}
.tabs .count{display:inline-block;margin-inline-start:6px;background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:.72rem;padding:1px 7px;vertical-align:1px}
.tab-h{font-size:1.5rem;margin:0 0 6px}
.pending-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin:0 0 20px;font-weight:600}
.brief{margin:6px 0 20px}
.brief-greet{font-size:1.15rem;margin:0 0 16px;max-width:60ch}
.brief-item{padding:14px 0;border-top:1px solid var(--line)}
.brief-item h3{font-size:1.04rem;margin:6px 0 4px}
.brief-item p{margin:0;color:var(--muted);max-width:66ch}
.area-tag{display:inline-block;font-size:.76rem;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 10px}
.old-brief{border-top:1px solid var(--line);padding:10px 0}
.old-brief summary{cursor:pointer;font-weight:600}
.proposal{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:0 0 14px;max-width:680px}
.proposal-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;color:var(--muted);font-size:.84rem}
.proposal h3{margin:10px 0 4px;font-size:1.06rem}
.proposal p{margin:0 0 4px;color:var(--muted)}
.decided{list-style:none;padding:0;margin:0;max-width:680px}
.decided li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding:10px 0;border-top:1px solid var(--line);font-size:.93rem}
.decided .d-title{flex:1 1 240px}
.decided time{color:var(--muted);font-size:.82rem}
.status-approved{color:var(--ok);font-weight:600}
.status-declined{color:var(--muted);font-weight:600}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="mark"><i aria-hidden="true"></i><span>Apacom</span></div>
  <div class="top-r">
  <div class="top-user" id="topUser" hidden>
    <button type="button" class="avatar-btn" id="topAvatarBtn"><span class="avatar sm" id="topAvatar"></span><span id="topName"></span></button>
    <button type="button" class="btn ghost sm" id="logoutBtn" data-t="logout"></button>
  </div>
  <div class="lang">
    <button class="lang-btn" id="langBtn" aria-haspopup="menu" aria-expanded="false">
      <span class="flag" id="langFlag"></span><span id="langName"></span><span aria-hidden="true">▾</span>
    </button>
    <div class="lang-menu" id="langMenu" role="menu"></div>
  </div>
  </div>
</header>
<div class="flash-wrap"><p class="flash" id="flash" role="status" hidden></p></div>

<main id="app">
  <div id="hero">
    <h1 id="heroTitle"></h1>
    <p class="lead" id="heroSub"></p>
  </div>

  <ol class="steps" id="steps" aria-label="Progress"></ol>

  <!-- SIGN IN -->
  <section id="login" hidden>
    <h2 data-t="signInTitle"></h2>
    <form id="fL" novalidate>
      <div class="field"><label class="lbl" for="liEm" data-t="email"></label><input class="inp" id="liEm" type="email" autocomplete="email" dir="ltr"></div>
      <div class="field"><label class="lbl" for="liPw" data-t="password"></label><input class="inp" id="liPw" type="password" autocomplete="current-password" dir="ltr"><div class="err" id="liErr"></div></div>
      <button class="btn full" id="liBtn" type="submit" data-t="signInBtn"></button>
    </form>
    <p class="switch"><button type="button" class="link" id="toReset" data-t="forgotLink"></button></p>
    <p class="switch"><span data-t="noAccount"></span> <button type="button" class="link" id="toRegister" data-t="createLink"></button></p>
  </section>

  <!-- FORGOT PASSWORD -->
  <section id="reset" hidden>
    <h2 data-t="resetTitle"></h2>
    <form id="fR1" novalidate>
      <p class="sub" data-t="resetSub"></p>

async function detectCountry(){
  // 1) IP lookup. Works when the page is self-hosted (e.g. Netlify).
  //    Inside the claude.ai viewer outside network calls are blocked, so this fails fast and we fall back.
  try{
    const ctl = new AbortController(); const tm = setTimeout(()=>ctl.abort(), 2000);
    const r = await fetch("https://ipapi.co/country/", {signal:ctl.signal}); clearTimeout(tm);
    if(r.ok){ const c = (await r.text()).trim().toUpperCase(); if(CODES.includes(c)) return {code:c, source:"ip"}; }
  }catch(e){}
  // 2) device time zone
  try{ const tz = Intl.DateTimeFormat().resolvedOptions().timeZone; if(TZ[tz]) return {code:TZ[tz], source:"device"}; }catch(e){}
  // 3) browser language region, e.g. fr-CA
  for(const l of (navigator.languages||[navigator.language||""])){
    const m = /[-_]([A-Z]{2})\b/i.exec(l); if(m && CODES.includes(m[1].toUpperCase())) return {code:m[1].toUpperCase(), source:"device"};
  }
  return null;
}

/* ============ storage: claude.ai db → localStorage → memory ============
   registry/<sha256(email)> = {uid}       shared, holds no personal data, enforces one account per email
   data/users/me/<uid>      = profile     private to the signed-in claude.ai viewer
   Production: replace with a real backend (auth server + database). */
const Store = {
  mode:"memory", db:null, mem:{reg:{}, prof:{}, session:null}, ready:null,
  init(){
    this.ready = (async ()=>{
      try{
        if(window.claude && typeof window.claude.use === "function"){
          const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
          if(db && user && await user.id()){ this.db = db; this.mode = "db"; return; }
        }
      }catch(e){}
      try{ localStorage.setItem("_apa","1"); localStorage.removeItem("_apa"); this.mode = "local"; }catch(e){ this.mode = "memory"; }
    })();
    return this.ready;
  },
  _lget(k){ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } },
  _lset(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  _lmap(k, fn){ const m = this._lget(k)||{}; fn(m); this._lset(k, m); },
  async getReg(h){
    await this.ready;
    if(this.mode==="db"){ const s = await this.db.doc("registry/"+h).get(); return s.exists ? (s.data()||{}) : null; }
    if(this.mode==="local") return (this._lget("apa_registry")||{})[h] || null;
    return this.mem.reg[h] || null;
  },
  async setReg(h, uid){
    const v = {uid, at:Date.now()};
    if(this.mode==="db") return this.db.doc("registry/"+h).set(v);
    if(this.mode==="local") return this._lmap("apa_registry", m=>{ m[h]=v; });
    this.mem.reg[h]=v;
  },
  async delReg(h){
    if(this.mode==="db") return this.db.doc("registry/"+h).delete();
    if(this.mode==="local") return this._lmap("apa_registry", m=>{ delete m[h]; });
    delete this.mem.reg[h];
  },
  async getProfile(uid){
    await this.ready;
    if(this.mode==="db"){ const s = await this.db.collection("data/users/me").doc(uid).get(); return s.exists ? s.data() : null; }
    if(this.mode==="local") return (this._lget("apa_profiles")||{})[uid] || null;
    return this.mem.prof[uid] || null;
  },
  async saveProfile(p){
    p.updatedAt = new Date().toISOString();
    const data = JSON.parse(JSON.stringify(p));
    if(this.mode==="db") return this.db.collection("data/users/me").doc(p.uid).set(data);
    if(this.mode==="local") return this._lmap("apa_profiles", m=>{ m[p.uid]=data; });
    this.mem.prof[p.uid]=data;
  },
  async delProfile(uid){
    if(this.mode==="db") return this.db.collection("data/users/me").doc(uid).delete();
    if(this.mode==="local") return this._lmap("apa_profiles", m=>{ delete m[uid]; });
    delete this.mem.prof[uid];
  },
  getSession(){ try{ return localStorage.getItem("apa_session"); }catch(e){ return this.mem.session; } },
  setSession(uid){ try{ localStorage.setItem("apa_session", uid); }catch(e){} this.mem.session=uid; },
  clearSession(){ try{ localStorage.removeItem("apa_session"); }catch(e){} this.mem.session=null; }
};
async function sha256(s){
  try{ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
  catch(e){ let h=0; for(const ch of s){ h=(h*31+ch.charCodeAt(0))|0; } return "h"+(h>>>0).toString(16); }
}
const hex = b => [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
function randomId(n=16){ const a=new Uint8Array(n); crypto.getRandomValues(a); return hex(a); }
/* password: salted PBKDF2 in this demo. A real backend must hash on the server (argon2/bcrypt). */
async function hashPw(pw, salt, iter=150000){
  salt = salt || randomId(16);
  try{
    const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt:new TextEncoder().encode(salt), iterations:iter}, key, 256);
    return {alg:"PBKDF2-SHA256", iter, salt, hash:hex(bits)};
  }catch(e){ return {alg:"SHA256", iter:1, salt, hash:await sha256(salt+pw)}; }
}

  h.textContent = (st.detected && st.country===st.detected.code) ? t(st.detected.source==="ip"?"detectedIp":"detectedDevice") : "";

function countryMatches(q){
  const nq = norm(q);
  const coll = new Intl.Collator(lang);
  const all = CODES.map(c=>({c, name:countryName(c,lang)})).sort((a,b)=>coll.compare(a.name,b.name));
  if(!nq) return all.map(x=>({...x, rank:0}));
  const out=[];
  for(const x of all){
    const ix = SEARCH_INDEX[x.c]; let rank = 99;
    if(x.c.toLowerCase()===nq || ix.aliases.includes(nq)) rank=0;
    else if(ix.names.some(n=>n.startsWith(nq)) || ix.aliases.some(a=>a.startsWith(nq))) rank=1;
    else if(ix.names.some(n=>n.includes(nq)) || ix.aliases.some(a=>a.includes(nq))) rank=2;
    if(rank<99) out.push({...x, rank});
  }
  return out.sort((a,b)=>a.rank-b.rank || coll.compare(a.name,b.name));
}

async function askApa(d){
  if(st.asking) return;
  const p=st.profile, q=(st.askDraft||"").trim();
  st.asking=true; renderAgentTab();
  const prev=((p.answers||{})[d.key]||[]).slice(0,5).map(a=>a.title);
  const ctx={country:countryName(p.country,"en"), situation:p.situation, hardest_now:p.challenge,
             goals_in_this_area:(p.goals||[]).filter(g=>d.goals.includes(g)).map(g=>T.en["g_"+g]), happier_this_year:p.dream, horizon:p.horizon};
  const prompt=`You are APA, a personal agent that helps one person with the "${T.en["d_"+d.key]}" part of their life (${d.about}).
Person (JSON): ${JSON.stringify(ctx)}
Titles of earlier answers, do not repeat them: ${JSON.stringify(prev)}
${q ? `The person asks: """${q}"""` : "No specific question: give the most useful next update for this area."}
Write everything in ${LANG_NAME[lang]}. Return ONLY a JSON object, no markdown:
{"title":"short title","summary":"2-3 sentences","actions":["3 to 5 concrete steps"],"resources":["2 to 4 real, well-known organizations, programs or websites, international or in the person's country"]}
Be practical and kind. You are not a financial, legal or medical professional; say so when it matters.`;
  try{
    const r = await sampleNs.json(prompt, {modelTier:"default"});
    if(!r || !r.title) throw new Error("bad");
    const a={at:new Date().toISOString(), lang, q, title:String(r.title), summary:String(r.summary||""),

async function handlePhoto(input, errId){
  const file=input.files[0]; input.value=""; setErr("photoErr"); setErr("headPhotoErr");
  if(!file) return; if(!/^image\//.test(file.type)) return setErr(errId,"photoErr");
  try{
    const url = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
    const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const S=256, cv=document.createElement("canvas"); cv.width=cv.height=S; const cx=cv.getContext("2d");
    const side=Math.min(img.width,img.height); cx.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,S,S);
    st.profile.photo = cv.toDataURL("image/jpeg",0.85);
    await Store.saveProfile(st.profile); renderCabinet(); renderTopUser(); setOk("photoOk","saved");
  }catch(e){ setErr(errId,"photoErr"); }
}

async function makeBrief(){
  if(st.briefing || !sampleNs) return;
  const p=st.profile; st.briefing=true; renderTodayTab();
  const areas = DOMAINS.filter(d=>!d.soon).map(d=>({area:d.key, goals:(p.goals||[]).filter(g=>d.goals.includes(g))}));
  const ctx={country:countryName(p.country,"en"), situation:p.situation, hardest_now:p.challenge, happier_this_year:p.dream, horizon:p.horizon,
             areas:areas.map(a=>({area:a.area, goals:a.goals.map(g=>({key:g, label:T.en["g_"+g]}))}))};
  const recent=(p.briefs||[]).slice(0,3).flatMap(b=>(b.items||[]).map(i=>i.headline));
  const pendingTitles=(p.actions||[]).filter(a=>a.status==="pending").map(a=>a.title);
  const prompt=`You are APA, a personal agent that works around the clock for one person. Prepare their daily brief for ${todayKey()}.
Person (JSON): ${JSON.stringify(ctx)}
Recent headlines, do not repeat: ${JSON.stringify(recent)}
Proposals already waiting for approval, do not repeat: ${JSON.stringify(pendingTitles)}

{"greeting":"one warm, specific sentence",
 "items":[{"area":"social or economic","headline":"short","detail":"1-2 sentences: a concrete finding, tip or opportunity"}],
 "proposals":[{"area":"social or economic","goal":"one of the goal keys above","kind":"apply, contact, enroll, book or other","title":"short action APA could take for the person","detail":"exactly what APA would do and why it helps"}]}
Give 2 to 4 items covering the areas that have goals, and 1 to 3 proposals. Proposals must be things that need the person's permission. Be practical and kind; never present financial, legal or medical guidance as certain.`;
  try{
    const r = await sampleNs.json(prompt, {modelTier:"default"});
    if(!r || !Array.isArray(r.items)) throw new Error("bad");
    const okArea = a => a==="social"||a==="economic" ? a : "social";
    const brief={date:todayKey(), at:new Date().toISOString(), lang, greeting:String(r.greeting||""),
      items:r.items.slice(0,5).map(i=>({area:okArea(i.area), headline:String(i.headline||""), detail:String(i.detail||"")}))};
    p.briefs=[brief, ...(p.briefs||[]).filter(b=>b.date!==brief.date)].slice(0,7);
    const allGoals=[...GOALS.social, ...GOALS.economic];
    (Array.isArray(r.proposals)?r.proposals:[]).slice(0,3).forEach(x=>{
      p.actions=p.actions||[];

        title:String(x.title||""), detail:String(x.detail||""), status:"pending", createdAt:new Date().toISOString(), lang});
    });
    p.actions=(p.actions||[]).slice(0,50);
    await Store.saveProfile(p);
    st.briefing=false; renderCabinet();
  }catch(err){
    st.briefing=false; if(err && err.code==="not_granted") sampleNs=null;
    renderTodayTab(); if($("briefErr")) setErr("briefErr","briefErr");
  }
}

      const li=el("li"); const s=el("span","status-"+a.status, t("st_"+a.status));
      const u=el("button","link muted-link",t("undo")); u.type="button"; u.onclick=()=>decide(a,"pending");
      li.append(el("span","d-title",a.title), s, el("time",null,fmtDate(a.decidedAt)), u); ul.appendChild(li);
    });
    box.appendChild(ul);
  }
}

function docLink(doc, key){
  const a=document.createElement("a"); a.href="#"+doc+"-"+lang; a.target="_blank"; a.rel="noopener"; a.textContent=t(key);
  a.addEventListener("click", e=>{ e.preventDefault(); e.stopPropagation(); openDoc(doc); });
  return a;
}
/* each document opens in its own new tab; if the browser blocks the new tab, it opens on this page */
function openDoc(doc){
  const url = location.href.split("#")[0] + "#" + doc + "-" + lang;
  let w=null; try{ w = window.open(url, "_blank"); }catch(e){}
  if(w){ try{ w.opener=null; }catch(e){} } else { location.hash = doc + "-" + lang; }
}
function renderAgree(){
  const box=$("agreeTxt"); box.textContent="";
  const parts = t("agree").split(/(\{terms\}|\{conditions\})/);
  for(const p of parts){
    if(p==="{terms}") box.appendChild(docLink("terms","linkTerms"));
    else if(p==="{conditions}") box.appendChild(docLink("conditions","linkConditions"));
    else if(p) box.appendChild(document.createTextNode(p));
  }
}
function renderFooter(){
  const f=$("footer"); f.textContent="";
  const nav=document.createElement("nav"); nav.className="legal-links";
  nav.append(docLink("terms","linkTerms"), docLink("conditions","linkConditions"), docLink("privacy","linkPrivacy"));
  const p=document.createElement("p"); p.textContent=t("footer");
  f.append(nav,p);
}
let currentDoc=null;
function parseHash(){ const m=/^#(terms|conditions|privacy)(?:-(en|fr|zh|ar))?$/.exec(location.hash); return m?{doc:m[1], lang:m[2]}:null; }
function renderDoc(){
  const d = LEGAL[currentDoc][lang]; const art=$("docBody"); art.textContent="";
  const h=document.createElement("h1"); h.className="doc-title"; h.textContent=d.title;
  const date = fmtDate(LEGAL_VERSION+"T12:00:00");
  const up=document.createElement("p"); up.className="doc-meta"; up.textContent=t("updated",{date});
  const dr=document.createElement("p"); dr.className="note"; dr.textContent=t("draft");
  const intro=document.createElement("p"); intro.className="doc-intro"; intro.textContent=d.intro;
  art.append(h,up,dr,intro);
  d.s.forEach(([title,body],i)=>{ const h2=document.createElement("h2"); h2.textContent=(i+1)+". "+title; const p=document.createElement("p"); p.textContent=body; art.append(h2,p); });
  document.title = d.title + " | Apacom";
  $("docBack").textContent = t("backReg");
  try{ const want="#"+currentDoc+"-"+lang; if(location.hash!==want) history.replaceState(null,"",want); }catch(e){}
}
function route(){
  const r=parseHash();
  if(r){
    currentDoc=r.doc;
    if(r.lang && r.lang!==lang){ setLang(r.lang); }
    $("app").hidden=true; $("cab").hidden=true; $("topUser").hidden=true; $("docView").hidden=false; renderDoc(); window.scrollTo(0,0);
  } else if(currentDoc){
    currentDoc=null; $("docView").hidden=true; document.title="Apacom | Personal Agent"; showView(st.view);
  }
}
window.addEventListener("hashchange", route);

$("agree").addEventListener("change", ()=>{ setErr("agreeErr"); $("agree").removeAttribute("aria-invalid"); });
$("docBack").onclick = ()=>{ if(history.length<=1){ try{ window.close(); }catch(e){} } location.hash=""; };

/* ============ boot ============ */
buildIndex();
Store.init();
let saved=null; try{ saved=localStorage.getItem("apa_lang"); }catch(e){}
const navLang = (navigator.language||"en").slice(0,2);
setLang(saved && T[saved] ? saved : (T[navLang] ? navLang : "en"));
showView("s1");
route();
// restore a signed-in session
Store.ready.then(async ()=>{
  const uid = Store.getSession(); if(!uid) return;
  try{
    const p = await Store.getProfile(uid); if(!p){ Store.clearSession(); return; }
    st.profile = p;
    if(!p.goals || !p.goals.length){ loadChoices(p); go(3); } else openCabinet("today");
    if(currentDoc) route();
  }catch(e){}
});
detectCountry().then(d=>{ if(d){ st.detected=d; if(!st.country){ st.country=d.code; } renderCountryValue(); } });
</script>
