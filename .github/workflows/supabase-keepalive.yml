name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 * * *"   # every day at 06:17 UTC
  workflow_dispatch:         # manual "Run workflow" button for testing
    inputs:
      test_failure:
        description: "Simulate a failure (to test the FAILED alert)"
        type: boolean
        default: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Simulate failure (test only)
        if: ${{ inputs.test_failure }}
        run: |
          echo "Test failure requested"
          exit 1

      - name: Ping Supabase
        run: |
          code=$(curl -s -o response.txt -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}")
          echo "HTTP status: $code"
          cat response.txt
          [ "$code" = "200" ]

      - name: Notify OK
        if: success()
        run: |
          curl -s -H "Title: Supabase keep-alive OK" -H "Tags: white_check_mark" \
            -d "Apaworld database ping: HTTP 200" \
            "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"

      - name: Notify FAILED
        if: failure()
        run: |
          curl -s -H "Title: Supabase keep-alive FAILED" -H "Priority: high" -H "Tags: x" \
            -d "Apaworld database ping failed - check GitHub Actions" \
            "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"
