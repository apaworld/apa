<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apacom — Personal Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff; --ink:#15171c; --muted:#5d6472; --line:#e3e5ea; --soft:#f5f6f8;
  --accent:#2a3fe0; --accent-ink:#ffffff; --accent-soft:#eef0fd;
  --ok:#0f7d55; --err:#c0322b; --note:#fff8e1; --note-line:#f0d98a;
  --font:'Figtree','IBM Plex Sans Arabic','Noto Sans SC',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --emoji:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121318; --ink:#eceef3; --muted:#a1a7b4; --line:#2b2e37; --soft:#1b1d24;
    --accent:#7d8cff; --accent-ink:#0d0f1a; --accent-soft:#232848;
    --ok:#4fd1a0; --err:#ff8a80; --note:#2a2616; --note-line:#5b4f22;
  }
}
:root[data-theme="dark"]{
  --paper:#121318; --ink:#eceef3; --muted:#a1a7b4; --line:#2b2e37; --soft:#1b1d24;
  --accent:#7d8cff; --accent-ink:#0d0f1a; --accent-soft:#232848;
  --ok:#4fd1a0; --err:#ff8a80; --note:#2a2616; --note-line:#5b4f22;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
html[lang="zh"] body{font-family:'Noto Sans SC','Figtree',system-ui,sans-serif}
html[lang="ar"] body{font-family:'IBM Plex Sans Arabic','Figtree',system-ui,sans-serif;line-height:1.65}
.flag{font-family:var(--emoji);font-size:1.15em;line-height:1;font-style:normal}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;max-width:1080px;margin:0 auto}
.mark{font-weight:800;font-size:1.15rem;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.mark i{width:22px;height:22px;border-radius:50%;border:3px solid var(--accent);display:inline-block;position:relative}
.mark i::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--accent)}
.lang{position:relative}
.lang-btn{display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.lang-btn:hover{background:var(--soft)}
.lang-menu{position:absolute;inset-inline-end:0;top:calc(100% + 6px);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:250px;white-space:nowrap;box-shadow:0 10px 30px rgba(20,24,40,.12);z-index:30;display:none}
.lang-menu.open{display:block}
.lang-menu button{display:flex;width:100%;align-items:center;gap:10px;padding:9px 10px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:start}
.lang-menu button:hover,.lang-menu button[aria-checked="true"]{background:var(--accent-soft)}
.lang-menu small{color:var(--muted);margin-inline-start:auto;padding-inline-start:16px;font-size:.78rem}

/* hero */
main{max-width:560px;margin:0 auto;padding:28px 20px 60px}
h1{font-size:clamp(1.9rem,5.2vw,2.75rem);line-height:1.08;letter-spacing:-.035em;font-weight:800;margin:20px 0 14px}
html[lang="ar"] h1,html[lang="zh"] h1{letter-spacing:0;line-height:1.3}
h1 .hours{display:block;font-size:1.65em;letter-spacing:-.05em;color:var(--accent);font-variant-numeric:tabular-nums}
html[lang="ar"] h1 .hours,html[lang="zh"] h1 .hours{letter-spacing:0}
.lead{color:var(--muted);font-size:1.06rem;margin:0 0 32px;max-width:52ch}

/* stepper */
.steps{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 26px}
.steps li{flex:1;font-size:.82rem;color:var(--muted)}
.steps li::before{content:"";display:block;height:4px;border-radius:4px;background:var(--line);margin-bottom:7px}
.steps li.on{color:var(--ink);font-weight:600}
.steps li.on::before,.steps li.done::before{background:var(--accent)}
.steps b{font-variant-numeric:tabular-nums;margin-inline-end:4px}

/* form */
h2{font-size:1.4rem;letter-spacing:-.02em;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 22px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.row{grid-template-columns:1fr}}
.field{margin-bottom:16px;position:relative}
label.lbl,.lbl{display:block;font-size:.88rem;font-weight:600;margin-bottom:6px}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--paper);transition:border-color .15s}
.inp:hover{border-color:#c6cad3}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp[aria-invalid="true"]{border-color:var(--err)}
textarea.inp{min-height:84px;resize:vertical}
.err{color:var(--err);font-size:.85rem;margin-top:5px;min-height:0}
.err:empty{display:none}
.hint{color:var(--muted);font-size:.84rem;margin-top:5px}
.pw{position:relative}
.pw .inp{padding-right:76px}
[dir="rtl"] .pw .inp{padding-left:76px;padding-right:14px;text-align:right}
.pw-toggle{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--accent);font-weight:600;font-size:.86rem;padding:6px 8px;cursor:pointer}
.meter{display:flex;gap:4px;margin-top:8px;align-items:center}
.meter span{height:4px;flex:1;border-radius:4px;background:var(--line)}
.meter em{font-style:normal;font-size:.8rem;color:var(--muted);min-width:56px;text-align:end}
.meter[data-s="1"] span:nth-child(1){background:var(--err)}
.meter[data-s="2"] span:nth-child(-n+2){background:#d89a1c}
.meter[data-s="3"] span{background:var(--ok)}

/* country combobox */
.cb-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:start;cursor:pointer}
.cb-btn .ph{color:var(--muted)}
.cb-btn .chev{color:var(--muted);font-size:.8rem}
.cb-pop{position:absolute;inset-inline:0;top:calc(100% + 4px);background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(20,24,40,.14);z-index:20;display:none;overflow:hidden}
.cb-pop.open{display:block}
.cb-pop .inp{border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none}
.cb-list{max-height:290px;overflow-y:auto;margin:0;padding:4px;list-style:none}
.cb-list .grp{font-size:.76rem;color:var(--muted);padding:8px 10px 4px}
.cb-list [role="option"]{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 10px;border-radius:8px;cursor:pointer}
.cb-list [role="option"][aria-selected="true"]{font-weight:600}
.cb-list [role="option"].act{background:var(--accent-soft)}
.cb-list .code{color:var(--muted);font-size:.78rem;margin-inline-start:6px}
.cb-empty{padding:14px;color:var(--muted);font-size:.9rem}

/* choice groups */
fieldset{border:0;padding:0;margin:0 0 20px;min-width:0}
legend{font-size:.88rem;font-weight:600;margin-bottom:8px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:.92rem;transition:background .12s,border-color .12s}
.chip input:hover+span{border-color:#b9bec9}
.chip input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

/* buttons */
.actions{display:flex;gap:10px;margin-top:8px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:13px 22px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.55;cursor:default;filter:none}
.btn.full{width:100%}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.link{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:6px 0}
.link[disabled]{color:var(--muted);cursor:default}

.note{background:var(--note);border:1px solid var(--note-line);border-radius:10px;padding:12px 14px;font-size:.92rem;margin:0 0 18px}
.note b{font-variant-numeric:tabular-nums;letter-spacing:.12em;font-size:1.05rem}
.code-inp{font-size:1.5rem;letter-spacing:.5em;text-align:center;font-variant-numeric:tabular-nums}
.ok{color:var(--ok);font-weight:600}

/* done */
.summary{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:0 0 22px}
.summary dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0;font-size:.92rem}
.summary dt{color:var(--muted)}
.summary dd{margin:0}
.agents{list-style:none;padding:0;margin:0 0 22px}
.agents li{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:14px 0;border-top:1px solid var(--line)}
.agents li:last-child{border-bottom:1px solid var(--line)}
.agents .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);margin-top:7px;box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 18%,transparent)}
.agents h3{margin:0;font-size:1rem}
.agents p{margin:0;color:var(--muted);font-size:.92rem;grid-column:2}
.agents ul{grid-column:2;margin:6px 0 0;padding-inline-start:18px;font-size:.9rem}
.agents .rh{grid-column:2;font-size:.8rem;color:var(--muted);margin-top:8px;font-weight:600}
.status{font-size:.86rem;color:var(--muted);margin:0 0 18px}
footer{max-width:560px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:.8rem}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="mark"><i aria-hidden="true"></i><span>Apacom</span></div>
  <div class="lang">
    <button class="lang-btn" id="langBtn" aria-haspopup="menu" aria-expanded="false">
      <span class="flag" id="langFlag"></span><span id="langName"></span><span aria-hidden="true">▾</span>
    </button>
    <div class="lang-menu" id="langMenu" role="menu"></div>
  </div>
</header>

<main>
  <h1 id="heroTitle"></h1>
  <p class="lead" id="heroSub"></p>

  <ol class="steps" id="steps" aria-label="Progress"></ol>

  <!-- STEP 1: account -->
  <section id="s1">
    <form id="f1" novalidate>
      <div class="row">
        <div class="field">
          <label class="lbl" for="fn" data-t="firstName"></label>
          <input class="inp" id="fn" autocomplete="given-name" required>
          <div class="err" id="fnErr"></div>
        </div>
        <div class="field">
          <label class="lbl" for="ln" data-t="lastName"></label>
          <input class="inp" id="ln" autocomplete="family-name" required>
          <div class="err" id="lnErr"></div>
        </div>
      </div>
      <div class="field">
        <label class="lbl" for="em" data-t="email"></label>
        <input class="inp" id="em" type="email" autocomplete="email" inputmode="email" dir="ltr" required>
        <div class="err" id="emErr"></div>
      </div>
      <div class="field">
        <label class="lbl" for="pw" data-t="password"></label>
        <div class="pw">
          <input class="inp" id="pw" type="password" autocomplete="new-password" dir="ltr" required>
          <button type="button" class="pw-toggle" id="pwToggle"></button>
        </div>
        <div class="meter" id="meter" data-s="0" aria-live="polite"><span></span><span></span><span></span><em id="meterTxt"></em></div>
        <div class="hint" data-t="pwHint"></div>
        <div class="err" id="pwErr"></div>
      </div>
      <div class="field" id="cb">
        <span class="lbl" id="cbLbl" data-t="country"></span>
        <button type="button" class="inp cb-btn" id="cbBtn" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="cbLbl cbBtn">
          <span id="cbVal" class="ph"></span><span class="chev" aria-hidden="true">▾</span>
        </button>
        <div class="cb-pop" id="cbPop">
          <input class="inp" id="cbSearch" role="combobox" aria-controls="cbList" aria-expanded="true" aria-autocomplete="list" autocomplete="off">
          <ul class="cb-list" id="cbList" role="listbox" aria-labelledby="cbLbl"></ul>
        </div>
        <div class="hint" id="cbHint"></div>
        <div class="err" id="cbErr"></div>
      </div>
      <button class="btn full" id="createBtn" type="submit" data-t="createAccount"></button>
    </form>
  </section>

  <!-- STEP 2: verify -->
  <section id="s2" hidden>
    <h2 data-t="verifyTitle"></h2>
    <p class="sub" id="verifySent"></p>
    <p class="note" id="demoCode" role="status"></p>
    <form id="f2" novalidate>
      <div class="field">
        <label class="lbl" for="code" data-t="codeLabel"></label>
        <input class="inp code-inp" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" dir="ltr">
        <div class="err" id="codeErr"></div>
      </div>
      <button class="btn full" type="submit" data-t="verify"></button>
      <div class="actions" style="justify-content:space-between">
        <button type="button" class="link" id="resendBtn"></button>
        <button type="button" class="link" id="changeEmail" data-t="changeEmail"></button>
      </div>
    </form>
  </section>

  <!-- STEP 3: situation -->
  <section id="s3" hidden>
    <p class="ok" data-t="verified"></p>
    <h2 data-t="sitTitle"></h2>
    <p class="sub" data-t="sitSub"></p>
    <form id="f3" novalidate>
      <div id="sitGroups"></div>
      <div class="field">
        <label class="lbl" for="challenge" data-t="challenge"></label>
        <textarea class="inp" id="challenge" data-tph="challengePh"></textarea>
      </div>
      <div class="actions"><button class="btn" type="submit" data-t="next"></button></div>
    </form>
  </section>

  <!-- STEP 4: goals -->
  <section id="s4" hidden>
    <h2 data-t="goalsTitle"></h2>
    <p class="sub" data-t="goalsSub"></p>
    <form id="f4" novalidate>
      <div id="goalGroups"></div>
      <div class="field">
        <label class="lbl" for="dream" data-t="dream"></label>
        <textarea class="inp" id="dream" data-tph="dreamPh"></textarea>
      </div>
      <div id="hzGroup"></div>
      <div class="err" id="goalErr"></div>
      <div class="actions">
        <button class="btn ghost" type="button" id="back4" data-t="back"></button>
        <button class="btn" type="submit" data-t="finish"></button>
      </div>
    </form>
  </section>

  <!-- DONE -->
  <section id="s5" hidden>
    <h2 id="doneTitle"></h2>
    <p class="status" id="savedNote"></p>
    <div class="summary"><dl id="summary"></dl></div>
    <p class="sub" data-t="doneSub"></p>
    <ul class="agents" id="agents"></ul>
    <div class="actions">
      <button class="btn" id="planBtn" type="button" hidden data-t="planBtn"></button>
      <button class="btn ghost" id="restart" type="button" data-t="startOver"></button>
    </div>
    <p class="err" id="planErr" style="margin-top:12px"></p>
  </section>
</main>
<footer id="footer"></footer>

a/Buenos_Aires:AR,America/Buenos_Aires:AR,America/Sao_Paulo:BR,America/Caracas:VE,America/Havana:CU,America/Montevideo:UY,America/Asuncion:PY,America/La_Paz:BO,America/Guayaquil:EC,America/Panama:PA,America/Costa_Rica:CR,America/Guatemala:GT,America/Santo_Domingo:DO,America/Port-au-Prince:HT,America/Puerto_Rico:PR,America/Jamaica:JM"

async function detectCountry(){
  // 1) IP lookup. Works when the page is self-hosted (e.g. Netlify).
  //    Inside the claude.ai viewer outside network calls are blocked, so this fails fast and we fall back.
  try{
    const ctl = new AbortController(); const tm = setTimeout(()=>ctl.abort(), 2000);
    const r = await fetch("https://ipapi.co/country/", {signal:ctl.signal}); clearTimeout(tm);
    if(r.ok){ const c = (await r.text()).trim().toUpperCase(); if(CODES.includes(c)) return {code:c, source:"ip"}; }
  }catch(e){}
  // 2) device time zone
  try{ const tz = Intl.DateTimeFormat().resolvedOptions().timeZone; if(TZ[tz]) return {code:TZ[tz], source:"device"}; }catch(e){}
  // 3) browser language region, e.g. fr-CA
  for(const l of (navigator.languages||[navigator.language||""])){
    const m = /[-_]([A-Z]{2})\b/i.exec(l); if(m && CODES.includes(m[1].toUpperCase())) return {code:m[1].toUpperCase(), source:"device"};
  }
  return null;
}

/* ============ storage: claude.ai db → localStorage → memory ============ */
const Store = {
  mode:"memory", db:null, mem:{reg:{}, prof:{}},
  ready:null,
  init(){
    this.ready = (async ()=>{
      try{
        if(window.claude && typeof window.claude.use === "function"){
          const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
          if(db && user && await user.id()){ this.db = db; this.mode = "db"; return; }
        }
      }catch(e){}
      try{ localStorage.setItem("_apa","1"); localStorage.removeItem("_apa"); this.mode = "local"; }catch(e){ this.mode = "memory"; }
    })();
    return this.ready;
  },
  _lget(k){ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } },
  _lset(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  async emailTaken(h){
    await this.ready;
    if(this.mode==="db"){ try{ const s = await this.db.doc("registry/"+h).get(); return s.exists; }catch(e){ return false; } }
    if(this.mode==="local") return !!(this._lget("apa_registry")||{})[h];
    return !!this.mem.reg[h];
  },
  async register(h){
    // only a hash of the email goes into the shared registry, never the address itself
    if(this.mode==="db"){ await this.db.doc("registry/"+h).set({at: Date.now()}); return; }
    if(this.mode==="local"){ const r = this._lget("apa_registry")||{}; r[h] = Date.now(); this._lset("apa_registry", r); return; }
    this.mem.reg[h] = Date.now();
  },
  async saveProfile(h, data){
    if(this.mode==="db"){ await this.db.collection("data/users/me").doc(h).set(data); return; }
    if(this.mode==="local"){ const p = this._lget("apa_profiles")||{}; p[h] = data; this._lset("apa_profiles", p); return; }
    this.mem.prof[h] = data;
  }
};
async function sha256(s){
  try{ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
  catch(e){ let h=0; for(const ch of s){ h=(h*31+ch.charCodeAt(0))|0; } return "h"+(h>>>0).toString(16); }
}

function countryMatches(q){
  const nq = norm(q);
  const coll = new Intl.Collator(lang);
  const all = CODES.map(c=>({c, name:countryName(c,lang)})).sort((a,b)=>coll.compare(a.name,b.name));
  if(!nq) return all.map(x=>({...x, rank:0}));
  const out=[];
  for(const x of all){
    const ix = SEARCH_INDEX[x.c]; let rank = 99;
    if(x.c.toLowerCase()===nq || ix.aliases.includes(nq)) rank=0;
    else if(ix.names.some(n=>n.startsWith(nq)) || ix.aliases.some(a=>a.startsWith(nq))) rank=1;
    else if(ix.names.some(n=>n.includes(nq)) || ix.aliases.some(a=>a.includes(nq))) rank=2;
    if(rank<99) out.push({...x, rank});
  }
  return out.sort((a,b)=>a.rank-b.rank || coll.compare(a.name,b.name));
}

  let firstBad=null; const bad=(id,errId,k)=>{ setErr(errId,k); $(id).setAttribute("aria-invalid","true"); firstBad=firstBad||$(id); };

$("goalGroups").addEventListener("change", ()=>setErr("goalErr"));
$("f3").addEventListener("submit", e=>{ e.preventDefault(); captureChoices(); st.challenge=$("challenge").value.trim(); go(4); });
$("back4").onclick = ()=>{ captureChoices(); st.dream=$("dream").value.trim(); go(3); };
$("f4").addEventListener("submit", async e=>{
  e.preventDefault(); captureChoices(); st.dream=$("dream").value.trim(); st.challenge=$("challenge").value.trim();
  if(!st.goals.length){ setErr("goalErr","errGoal"); $("goalGroups").querySelector("input").focus(); return; }
  const profile = {
    firstName:st.user.first, lastName:st.user.last, email:st.user.email, country:st.user.country, uiLanguage:lang,
    emailVerifiedAt:st.user.verifiedAt, situation:st.sit, challenge:st.challenge, goals:st.goals, dream:st.dream, horizon:st.horizon,
    updatedAt:new Date().toISOString()
  };
  try{ await Store.saveProfile(st.user.hash, profile); }catch(err){ Store.mode="memory"; Store.mem.prof[st.user.hash]=profile; }
  go(5); renderDone();
});

/* ============ done ============ */
let plan=null;
function renderDone(){
  $("doneTitle").textContent = t("doneTitle",{name:st.user.first});
  $("savedNote").textContent = t(Store.mode==="db"?"savedDb":Store.mode==="local"?"savedLocal":"savedMemory");
  const dl=$("summary"); dl.textContent="";
  const row=(k,v)=>{ if(!v) return; const dt=document.createElement("dt"); dt.textContent=t(k); const dd=document.createElement("dd"); dd.textContent=v; dl.append(dt,dd); };
  row("sumName", st.user.first+" "+st.user.last);
  row("sumEmail", st.user.email+"  ✓");
  row("sumCountry", flagOf(st.user.country)+"  "+countryName(st.user.country,lang));
  const sit = SIT.map(g=>{ const v=st.sit[g.key]; return Array.isArray(v)? v.map(x=>t(x)).join(", ") : (v?t(v):""); }).filter(Boolean).join("; ");
  row("sumSituation", sit);
  row("sumGoals", st.goals.map(g=>t("g_"+g)).join(", "));
  dl.querySelectorAll("dd").forEach((d,i)=>{ if(i===2){ d.innerHTML=""; const f=document.createElement("span"); f.className="flag"; f.textContent=flagOf(st.user.country); d.append(f, document.createTextNode("  "+countryName(st.user.country,lang))); } });
  renderAgents();
}
function renderAgents(){
  const ul=$("agents"); ul.textContent="";
  const list = plan ? plan.agents : st.goals.map(g=>({name:AGENTS[g][lang][0], mission:AGENTS[g][lang][1]}));
  for(const a of list){
    const li=document.createElement("li"); const dot=document.createElement("span"); dot.className="dot"; dot.setAttribute("aria-hidden","true");
    const h=document.createElement("h3"); h.textContent=a.name; const p=document.createElement("p"); p.textContent=a.mission;
    li.append(dot,h,p);
    if(a.steps && a.steps.length){ const rh=document.createElement("div"); rh.className="rh"; rh.textContent=t("firstSteps"); const s=document.createElement("ul"); a.steps.forEach(x=>{const i=document.createElement("li");i.textContent=x;s.appendChild(i);}); li.append(rh,s); }
    if(a.resources && a.resources.length){ const rh=document.createElement("div"); rh.className="rh"; rh.textContent=t("resources"); const s=document.createElement("ul"); a.resources.forEach(x=>{const i=document.createElement("li");i.textContent=x;s.appendChild(i);}); li.append(rh,s); }
    ul.appendChild(li);
  }
}
/* optional: ask Claude for a real first plan (only inside the claude.ai viewer) */
let sampleNs=null;
(async()=>{ try{ if(window.claude && window.claude.use){ sampleNs = await claude.use("sample"); if(sampleNs) $("planBtn").hidden=false; } }catch(e){} })();
$("planBtn").onclick = async ()=>{
  const b=$("planBtn"); b.disabled=true; b.textContent=t("planning"); setErr("planErr");
  const langName = {en:"English",fr:"French",zh:"Simplified Chinese (Mandarin)",ar:"Modern Standard Arabic"}[lang];
  const profile = {country: countryName(st.user.country,"en"), situation: st.sit, hardest_now: st.challenge, goals: st.goals, happier_this_year: st.dream, horizon: st.horizon};
  const prompt = `You plan helper agents for a personal AI agent that supports one person's social and economic wellbeing.
Person profile (JSON): ${JSON.stringify(profile)}
Write everything in ${langName}. Return ONLY a JSON object, no markdown, with this shape:
{"agents":[{"name":"short agent name","mission":"one sentence","steps":["3 concrete first steps for this week"],"resources":["2-3 real, well-known organizations, programs or websites, international or in the person's country"]}]}
Create one agent per goal (max 6). Be practical and kind; never give individual financial or legal advice as certainty.`;
  try{
    const res = await sampleNs.json(prompt, {modelTier:"default"});
    if(!res || !Array.isArray(res.agents)) throw new Error("bad");
    plan = {agents: res.agents.slice(0,6).map(a=>({name:String(a.name||""), mission:String(a.mission||""), steps:(a.steps||[]).map(String).slice(0,4), resources:(a.resources||[]).map(String).slice(0,4)}))};
    renderAgents(); b.hidden=true;
  }catch(err){
    if(err && err.code==="not_granted"){ b.hidden=true; } else setErr("planErr","planErr");
  }finally{ b.disabled=false; b.textContent=t("planBtn"); }
};
$("restart").onclick = ()=>{
  Object.assign(st,{user:null, verify:null, sit:{}, goals:[], horizon:null, dream:"", challenge:""}); plan=null;
  ["fn","ln","em","pw","challenge","dream","code"].forEach(id=>$(id).value="");
  st.country = st.detected ? st.detected.code : null; renderChoiceGroups(); renderCountryValue(); updateMeter();
  if(sampleNs) $("planBtn").hidden=false; go(1); $("fn").focus();
};

/* ============ boot ============ */
buildIndex();
Store.init();
let saved=null; try{ saved=localStorage.getItem("apa_lang"); }catch(e){}
const navLang = (navigator.language||"en").slice(0,2);
setLang(saved && T[saved] ? saved : (T[navLang] ? navLang : "en"));
go(1);
detectCountry().then(d=>{ if(d){ st.detected=d; if(!st.country){ st.country=d.code; } renderCountryValue(); } });
</script>
</body>
</html>
